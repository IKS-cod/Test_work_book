<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список книг</title>
</head>
<body>
<h1>Список книг</h1>

<form th:action="@{/api/books}" th:method="get">
    <table>
        <tr>
            <td>Название:</td>
            <td><input type="text" name="title" th:value="${title}"/></td>
        </tr>
        <tr>
            <td>Бренд:</td>
            <td><input type="text" name="brand" th:value="${brand}"/></td>
        </tr>
        <tr>
            <td>Год:</td>
            <td><input type="number" name="year" th:value="${year}"/></td>
        </tr>
        <tr>
            <td>Количество:</td>
            <td><input type="number" name="limit" th:value="${limit}" /></td>
        </tr>
        <tr>
            <td colspan="2"><input type="submit" value="Фильтровать"/></td>
        </tr>
    </table>
</form>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Код поставщика</th>
        <th>Название</th>
        <th>Бренд</th>
        <th>Год</th>
        <th>Количество</th>
        <th>Цена</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}">ID</td>
        <td th:text="${book.vendorCode}">Код поставщика</td>
        <td th:text="${book.title}">Название</td>
        <td th:text="${book.brand}">Бренд</td>
        <td th:text="${book.year}">Год</td>
        <td th:text="${book.stock}">Количество</td>
        <td th:text="${book.price}">Цена</td>
        <td>
            <a th:href="@{/api/books/update/{id}(id=${book.id})}">Обновить</a>
            <a th:href="@{/api/books/delete/{id}(id=${book.id})}">Удалить</a>
        </td>
    </tr>
    </tbody>
</table>

<a href="/api/books/create">Создать книгу</a>
</body>
</html>
